; ===============================================================
; PEPCO Custom Loot Tables - Configuration File
; ===============================================================
;
; HOW TO USE:
; 1. Uncomment a section below (remove the ; before [SectionName])
; 2. Run /clt reload in-game to apply changes
;
; FORMAT: Item1=TypeId|SubtypeId|AmountMin|AmountMax|Frequency
;         Item2=TypeId|SubtypeId|AmountMin|AmountMax|Frequency
;         (use numbered items: Item1, Item2, Item3, etc.)
;
; ACTIONS:
;   Add     - Add items to existing loot
;   Replace - Replace all items in container
;   Clear   - Remove all items from container
;
; PRIORITY (default=0):
;   >= 0: Items added at TOP of inventory (protected)
;   < 0:  Items added at END of inventory (can be removed to make room)
;
; ITEM COUNT LIMITS (optional):
;   MaxItems  - Maximum different item types to spawn (excess items randomly removed)
;              Supports single value (e.g., MaxItems=3) or range (e.g., MaxItems=2-5)
;
; CONTAINER TYPE (optional):
;   ContainerType=<Type>  - Apply loot to containers of this type
;                          Supports comma-separated list for multiple types:
;                          ContainerType=PersonalContainerSmall,PersonalContainerLarge
;
; ENTITY LOOT (optional):
;   Entity=<SubtypeId>  - Apply loot to creature/character deaths (e.g., Entity=Wolf)
;                        Supports comma-separated list for multiple entities:
;                        Entity=Space_spider,Space_spider_black,Space_spider_brown
;                        Use EITHER Entity= OR ContainerType=, not both
;

[Unknown_Suits_Add]
Action=Add
Priority=2
ContainerType=PersonalContainerSmall,PersonalContainerLarge,StationContainerType
MaxItems=1
Item1=MyObjectBuilder_Datapad|Mad_Mac_Tier1_Jetpack|1|1|0.1
Item2=MyObjectBuilder_Datapad|Mad_Mac_Tier2_Jetpack|1|1|0.03
Item3=MyObjectBuilder_Datapad|Mad_Mac_Tier3_Jetpack|1|1|0.01
